# juicer.run — the docs site for juicer, built with juicer (dogfood ftw).
#
# Local preview:   sbt 'juicerJVM/run serve -s docs'
# Production:      pushed to `stable`, built and deployed to juicer.run.

title       = "Juicer"
author      = "Ed Maxedon"
baseURL     = "https://juicer.run/"
description = "A cross-platform static site generator written in Scala 3. Markdown content, Hugo-style templates, sensible defaults, ships as a single sbt-launchable JAR."

# Drives the topbar GitHub icon + the homepage "Star on GitHub" hero
# button. Themes that aren't doc-themes (juicercafe, juicerchurch) also
# read this if they choose to surface a repo link.
repoURL = "https://github.com/edadma/juicer"

theme = "juicerdocs"

# Bilingual docs (English + French). Content lives under content/<lang>/.
# `defaultLanguageInRoot` keeps English at the site root (juicer.run/…) so
# existing URLs and inbound links don't move; French is served under /fr/.
languages             = ["en", "fr"]
defaultLanguage       = "en"
defaultLanguageInRoot = true

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# GitHub Pages (and any other static-file host) serves the on-disk layout
# literally, so the URL space MUST match the file tree. The `standard`
# baseline ships htmlDir = "html" — useful for tidy local browsing but it
# breaks deploys (URLs strip the segment, file paths don't). Force it off.
htmlDir = ""

# Top-level `favicon` wins over `[juicerdocs] logo` for the <link rel=icon>
# tag. Setting it explicitly (instead of letting the theme fall back to
# logo) lets us swap the favicon independently of the topbar wordmark logo.
favicon = "/juicer-logo.png"

# `docs/demos/` holds the SOURCE for each theme's live demo (and the
# minimal smoke-test example). They're full juicer sites in their own
# right, NOT docs content — exclude them from the site walk so juicer
# doesn't try to render their layouts/partials as part of this site.
# `bin/build-demos.sh` builds each one into _site/themes/<theme>/demo/
# AFTER the main docs build (so the demo's rendered output lands at
# the URL the docs sidebar's "Demo site" leaf points at).
excludeDirs = ["demos"]

# Recompile the juicerdocs theme's CSS from its SCSS source on every
# build, fingerprint the output for cache-busting, and bundle/minify
# the theme JS via esbuild. When `sass` / `esbuild` aren't on PATH
# the pipeline degrades to a verbatim copy of the source — the URL
# still resolves so the page still renders, just without the freshly-
# compiled rebuild. See docs/content/reference/config.md → [assets].
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
version = "v0.2.0"
# `logo` was previously hard-coded as a fallback in the juicerdocs theme
# templates. The theme now omits the <img>/<link> elements entirely when
# `logo` is unset, so the juicer.run site has to declare it explicitly.
logo = "/juicer-logo.png"
# `getStarted` (homepage hero CTA → /getting-started/) is ON BY DEFAULT
# in the juicerdocs theme. Sites without a getting-started section
# should set `getStarted = false` here to hide it.
