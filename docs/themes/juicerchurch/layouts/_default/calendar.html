<!-- Calendar layout — month-grid view of every event. STAGE 3 STUB.
     Currently renders the page intro + a placeholder note pointing at
     /events/ for the list view. The real implementation needs a JS
     month-grid built from .site.pages filtered to the events section,
     plus per-event positioning by date and a recurring-event renderer
     for weekly meetings. -->
{{ define content }}
  <article class="juicerchurch-page-wrap">
    <h1 class="juicerchurch-page-title">{{ .page.title }}</h1>
    {{ if .content }}
    <div class="juicerchurch-content">
      {{ .content }}
    </div>
    {{ end }}

    <p class="juicerchurch-content"><em>Calendar view coming soon. For now,
    see the chronological <a href="{{ relURL '/events/' }}">events list</a>.</em></p>
  </article>
{{ end }}
