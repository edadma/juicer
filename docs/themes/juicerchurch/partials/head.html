<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{ if .page.title }}<title>{{ .page.title }} — {{ .site.title }}</title>{{ else }}<title>{{ .site.title }}</title>{{ end }}
{{ if .page.summary }}<meta name="description" content="{{ .page.summary }}">{{ end }}
{{ if .page.permalink }}<link rel="canonical" href="{{ .page.permalink }}">{{ end }}

<!-- OpenGraph / Twitter cards. Resolves image / description from frontmatter
     (ogImage/image then ogDescription/description/summary), falling back to
     site-wide ogImage / image. -->
{{ ogTags .page }}

<!-- Atom feed discovery — juicer always emits a site-wide feed. -->
<link rel="alternate" type="application/atom+xml" title="{{ .site.title }}" href="{{ relURL '/feed.xml' }}">

<link rel="stylesheet" href="{{ relURL '/juicerchurch.css' }}">

<!-- Per-site palette overrides emitted from site.toml [juicerchurch]. -->
{{ if .site.juicerchurch }}
<style>
  :root {
    {{ if .site.juicerchurch.brand }}--brand: {{ .site.juicerchurch.brand }};{{ end }}
    {{ if .site.juicerchurch.accent }}--accent: {{ .site.juicerchurch.accent }};{{ end }}
    {{ if .site.juicerchurch.leaf }}--leaf: {{ .site.juicerchurch.leaf }};{{ end }}
  }
</style>
{{ end }}
