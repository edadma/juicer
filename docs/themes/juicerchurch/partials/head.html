<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{ if .page.title }}<title>{{ .page.title }} — {{ .site.title }}</title>{{ else }}<title>{{ .site.title }}</title>{{ end }}
{{ if .page.summary }}<meta name="description" content="{{ .page.summary }}">{{ end }}
{{ if .page.permalink }}<link rel="canonical" href="{{ .page.permalink }}">{{ end }}
{{ if .site.favicon }}<link rel="icon" href="{{ relURL .site.favicon }}">{{ end }}

<!-- OpenGraph / Twitter cards. Resolves image / description from frontmatter
     (ogImage/image then ogDescription/description/summary), falling back to
     site-wide ogImage / image. -->
{{ ogTags .page }}

<!-- Atom feed discovery — juicer always emits a site-wide feed. -->
<link rel="alternate" type="application/atom+xml" title="{{ .site.title }}" href="{{ relURL '/feed.xml' }}">

<link rel="stylesheet" href="{{ relURL '/juicerchurch.css' }}">

<!-- Per-site palette overrides emitted from site.toml [juicerchurch].
     Light-mode tokens land on :root; the *Dark variants land on
     [data-theme="dark"] so they cleanly override the theme's hardcoded
     dark palette without leaking into light mode. -->
{{ if .site.juicerchurch }}
<style>
  :root {
    {{ if .site.juicerchurch.brand }}--brand: {{ .site.juicerchurch.brand }};{{ end }}
    {{ if .site.juicerchurch.brandStrong }}--brand-strong: {{ .site.juicerchurch.brandStrong }};{{ end }}
    {{ if .site.juicerchurch.brandSoft }}--brand-soft: {{ .site.juicerchurch.brandSoft }};{{ end }}
    {{ if .site.juicerchurch.accent }}--accent: {{ .site.juicerchurch.accent }};{{ end }}
    {{ if .site.juicerchurch.leaf }}--leaf: {{ .site.juicerchurch.leaf }};{{ end }}
  }
  [data-theme="dark"] {
    {{ if .site.juicerchurch.brandDark }}--brand: {{ .site.juicerchurch.brandDark }};{{ end }}
    {{ if .site.juicerchurch.brandStrongDark }}--brand-strong: {{ .site.juicerchurch.brandStrongDark }};{{ end }}
    {{ if .site.juicerchurch.brandSoftDark }}--brand-soft: {{ .site.juicerchurch.brandSoftDark }};{{ end }}
    {{ if .site.juicerchurch.accentDark }}--accent: {{ .site.juicerchurch.accentDark }};{{ end }}
    {{ if .site.juicerchurch.leafDark }}--leaf: {{ .site.juicerchurch.leafDark }};{{ end }}
  }
</style>
{{ end }}
