<!-- Wiki topbar: brand on the left, a search button (opens the search
     modal), a "Tags" link, and a theme-toggle. -->
<header class="juicerwiki-topbar">
  <div class="juicerwiki-topbar-inner">
    <a class="juicerwiki-brand" href="{{ relURL '/' }}">
      <span class="juicerwiki-brand-name">{{ .site.title }}</span>
      {{ if .site.tagline }}<span class="juicerwiki-brand-tagline">{{ .site.tagline }}</span>{{ end }}
    </a>

    <div class="juicerwiki-topbar-actions">
      {{ if .site.topnav }}
      <nav class="juicerwiki-nav" aria-label="Main">
        {{ for n <- .site.topnav }}<a href="{{ if n.url }}{{ relURL n.url }}{{ else }}#{{ end }}">{{ n.label }}</a>{{ end }}
      </nav>
      {{ end }}
      <button class="juicerwiki-search-trigger" type="button" aria-label="Open search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Search</span>
        <kbd class="juicerwiki-kbd">⌘K</kbd>
      </button>
      <button class="juicerwiki-theme-toggle" type="button" data-juicer-theme-toggle aria-label="Toggle theme">
        <svg class="juicerwiki-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="juicerwiki-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

{{ partial 'dark-mode-toggle' . }}
