<!-- Wiki footer: small, quiet. -->
<footer class="juicerwiki-footer">
  <div class="juicerwiki-footer-inner">
    <div>
      <span>© {{ .site.now.year }} {{ if .site.author }}{{ .site.author }}{{ else }}{{ .site.title }}{{ end }}</span>
      {{ if not .site.hideJuicerCredit }}
      <span class="juicerwiki-footer-credit"> · Built with <a href="https://github.com/edadma/juicer">juicer</a></span>
      {{ end }}
    </div>
    {{ if .site.links }}
    <ul class="juicerwiki-footer-links">
      {{ for l <- .site.links }}<li><a href="{{ l.url }}">{{ l.label }}</a></li>{{ end }}
    </ul>
    {{ end }}
  </div>
</footer>
