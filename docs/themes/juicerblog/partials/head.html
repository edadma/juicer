<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{ if .page.title }}<title>{{ .page.title }} — {{ .site.title }}</title>{{ else }}<title>{{ .site.title }}</title>{{ end }}
{{ if .site.favicon }}<link rel="icon" href="{{ relURL .site.favicon }}">{{ end }}

{{ partial 'seo' . }}

<link rel="stylesheet" href="{{ relURL '/juicerblog.css' }}">

<!-- Site-supplied stylesheets, loaded AFTER the bundled theme CSS so
     they can override anything. Drop your file in static/site.css and
     set `customCSS = ["site.css"]` in site.toml; the list takes any
     number of paths in the order to load them. -->
{{ if .site.customCSS }}{{ for css <- .site.customCSS }}<link rel="stylesheet" href="{{ relURL css }}">
{{ end }}{{ end }}

<script src="{{ relURL '/juicerblog.js' }}" defer></script>

<!-- Per-site palette overrides emitted from site.toml [juicerblog] block.
     Same pattern as juicerdocs — sites can pin brand/accent without forking
     the theme CSS. Light tokens land on :root; *Dark variants land on
     [data-theme="dark"] so they cleanly override the theme's dark palette. -->
{{ if .site.juicerblog }}
<style>
  :root {
    {{ if .site.juicerblog.brand }}--brand: {{ .site.juicerblog.brand }};{{ end }}
    {{ if .site.juicerblog.brandStrong }}--brand-strong: {{ .site.juicerblog.brandStrong }};{{ end }}
    {{ if .site.juicerblog.brandSoft }}--brand-soft: {{ .site.juicerblog.brandSoft }};{{ end }}
    {{ if .site.juicerblog.accent }}--accent: {{ .site.juicerblog.accent }};{{ end }}
    {{ if .site.juicerblog.leaf }}--leaf: {{ .site.juicerblog.leaf }};{{ end }}
    {{ if .site.juicerblog.fontSans }}--font-sans: {{ .site.juicerblog.fontSans }};{{ end }}
    {{ if .site.juicerblog.fontSerif }}--font-serif: {{ .site.juicerblog.fontSerif }};{{ end }}
    {{ if .site.juicerblog.fontMono }}--font-mono: {{ .site.juicerblog.fontMono }};{{ end }}
    {{ if .site.juicerblog.measure }}--measure: {{ .site.juicerblog.measure }};{{ end }}
    {{ if .site.juicerblog.gutter }}--gutter: {{ .site.juicerblog.gutter }};{{ end }}
    {{ if .site.juicerblog.radiusLg }}--radius-lg: {{ .site.juicerblog.radiusLg }};{{ end }}
  }
  [data-theme="dark"] {
    {{ if .site.juicerblog.brandDark }}--brand: {{ .site.juicerblog.brandDark }};{{ end }}
    {{ if .site.juicerblog.brandStrongDark }}--brand-strong: {{ .site.juicerblog.brandStrongDark }};{{ end }}
    {{ if .site.juicerblog.brandSoftDark }}--brand-soft: {{ .site.juicerblog.brandSoftDark }};{{ end }}
    {{ if .site.juicerblog.accentDark }}--accent: {{ .site.juicerblog.accentDark }};{{ end }}
    {{ if .site.juicerblog.leafDark }}--leaf: {{ .site.juicerblog.leafDark }};{{ end }}
  }
</style>
{{ end }}
