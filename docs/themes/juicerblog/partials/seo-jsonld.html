<!-- JSON-LD structured data for juicerblog.
     Emitted as one or more <script type="application/ld+json"> blocks
     so we don't have to manage trailing commas across conditional
     schemas. Google and Bing both accept multiple JSON-LD scripts per
     page.

     What we emit:
       1. Homepage   → WebSite.
       2. Dated page → BlogPosting (the Article subtype for blog posts).
       3. Any page with ancestors → BreadcrumbList.

     Frontmatter `noindex: true` suppresses ALL JSON-LD (matches the
     sitemap.xml + <meta robots> story — a deliberately-hidden page
     should not advertise itself to crawlers in any form). -->

{{ if not .page.noindex }}

{{ if .page.isSection and not .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ jsonStr .site.title }}",
  "url": "{{ relURL '/' }}"{{ if .site.description }},
  "description": "{{ jsonStr .site.description }}"{{ end }}
}
</script>
{{ end }}

{{ if .page.dateISO and not .page.isSection }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ jsonStr .page.title }}",
  "url": "{{ jsonStr .page.permalink }}",
  "datePublished": "{{ jsonStr .page.dateISO }}"{{ if .page.summary }},
  "description": "{{ jsonStr .page.summary }}"{{ end }}{{ if .page.author }}{{ if .page.author.name }},
  "author": { "@type": "Person", "name": "{{ jsonStr .page.author.name }}" }{{ end }}{{ end }}{{ if .page.image }},
  "image": "{{ jsonStr .page.image }}"{{ end }},
  "mainEntityOfPage": "{{ jsonStr .page.permalink }}"
}
</script>
{{ end }}

{{ if .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{ for a, i <- .page.ancestors }}{ "@type": "ListItem", "position": {{ i + 1 }}, "name": "{{ jsonStr a.title }}", "item": "{{ jsonStr a.permalink }}" },
    {{ end }}{ "@type": "ListItem", "position": {{ (.page.ancestors | length) + 1 }}, "name": "{{ jsonStr .page.title }}", "item": "{{ jsonStr .page.permalink }}" }
  ]
}
</script>
{{ end }}

{{ end }}
