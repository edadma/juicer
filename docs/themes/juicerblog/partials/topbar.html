<header class="juicerblog-topbar">
  <div class="juicerblog-topbar-inner">
    <a class="juicerblog-brand" href="{{ relURL '/' }}">{{ .site.title }}</a>
    {{ if .site.tagline }}<span class="juicerblog-tagline">{{ .site.tagline }}</span>{{ end }}
    <nav class="juicerblog-nav" aria-label="Main">
      <a href="{{ relURL '/' }}">Home</a>
      <a href="{{ relURL '/archive/' }}">Archive</a>
      {{ if .site.tags }}<a href="{{ relURL '/tags/' }}">Tags</a>{{ end }}
      <!-- Authors / About are linked unconditionally — sites that don't
           use them will 404 the link, which is a less subtle failure mode
           than a missing nav item nobody can find. Sites that customize
           their nav can fork this partial. -->
      <a href="{{ relURL .site.authorsPath }}">Authors</a>
      <a href="{{ relURL '/about/' }}">About</a>
    </nav>
  </div>
</header>
