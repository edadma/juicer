<!-- JSON-LD structured data for juicercafe.
     Cafés / small businesses benefit most from LocalBusiness markup
     (Google Maps Knowledge Panel, opening-hours rich results), but
     juicer doesn't yet have a structured `[contact]` schema, so for
     now we emit:
       1. Homepage   → WebSite (+ LocalBusiness if `.site.business`
                       is set in site.toml — see configuration.md).
       2. Dated page → Article.
       3. Any page with ancestors → BreadcrumbList.

     Frontmatter `noindex: true` suppresses ALL JSON-LD. -->

{{ if not .page.noindex }}

{{ if .page.isSection and not .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ jsonStr .site.title }}",
  "url": "{{ relURL '/' }}"{{ if .site.description }},
  "description": "{{ jsonStr .site.description }}"{{ end }}
}
</script>
{{ if .site.business }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if .site.business.type }}{{ jsonStr .site.business.type }}{{ else }}LocalBusiness{{ end }}",
  "name": "{{ jsonStr .site.title }}",
  "url": "{{ relURL '/' }}"{{ if .site.business.phone }},
  "telephone": "{{ jsonStr .site.business.phone }}"{{ end }}{{ if .site.business.address }},
  "address": "{{ jsonStr .site.business.address }}"{{ end }}{{ if .site.business.image }},
  "image": "{{ jsonStr .site.business.image }}"{{ end }}
}
</script>
{{ end }}
{{ end }}

{{ if .page.dateISO and not .page.isSection }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ jsonStr .page.title }}",
  "url": "{{ jsonStr .page.permalink }}",
  "datePublished": "{{ jsonStr .page.dateISO }}"{{ if .page.summary }},
  "description": "{{ jsonStr .page.summary }}"{{ end }}{{ if .page.author }}{{ if .page.author.name }},
  "author": { "@type": "Person", "name": "{{ jsonStr .page.author.name }}" }{{ end }}{{ end }}{{ if .page.image }},
  "image": "{{ jsonStr .page.image }}"{{ end }},
  "mainEntityOfPage": "{{ jsonStr .page.permalink }}"
}
</script>
{{ end }}

{{ if .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{ for a, i <- .page.ancestors }}{ "@type": "ListItem", "position": {{ i + 1 }}, "name": "{{ jsonStr a.title }}", "item": "{{ jsonStr a.permalink }}" },
    {{ end }}{ "@type": "ListItem", "position": {{ (.page.ancestors | length) + 1 }}, "name": "{{ jsonStr .page.title }}", "item": "{{ jsonStr .page.permalink }}" }
  ]
}
</script>
{{ end }}

{{ end }}
