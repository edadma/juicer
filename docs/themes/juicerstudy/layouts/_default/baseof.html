<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial 'head' . }}
</head>
<body>
  {{ partial 'topbar' . }}

  <div class="juicerstudy-page">
    <aside class="juicerstudy-sidebar-aside">
      {{ partial 'sidebar' . }}
    </aside>
    <div class="juicerstudy-sidebar-backdrop" aria-hidden="true"></div>

    <main class="juicerstudy-main">
      <div class="juicerstudy-content">
        {{ partial 'breadcrumbs' . }}
        {{ block main . }}
          <article>
            <h1>{{ .page.title }}</h1>
            {{ .content }}
          </article>
        {{ end }}
        {{ partial 'prev-next' . }}
      </div>
    </main>

    <aside class="juicerstudy-rail-aside">
      {{ partial 'page-toc' . }}
    </aside>
  </div>

  {{ partial 'footer' . }}

  {{ partial 'search-modal' . }}

  <script src="{{ relURL '/juicerstudy.js' }}"></script>
</body>
</html>
