<dialog id="juicerstudy-search-modal" class="juicerstudy-search-modal" aria-labelledby="juicerstudy-search-modal-title">
  <div class="juicerstudy-search-modal-inner">
    <h2 id="juicerstudy-search-modal-title" class="juicerstudy-vh">Search</h2>
    <div class="juicerstudy-search-modal-bar">
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerstudy-search-modal-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
      </svg>
      <input id="juicerstudy-search-input" class="juicerstudy-search-modal-input" type="search" placeholder="Search…" autocomplete="off" />
      <kbd class="juicerstudy-search-modal-key">Esc</kbd>
    </div>
    <div id="juicerstudy-search-modal-results" class="juicerstudy-search-modal-results" role="listbox" aria-label="Search results"></div>
    <div class="juicerstudy-search-modal-hint">
      <kbd>↑</kbd><kbd>↓</kbd> to navigate
      <kbd>↵</kbd> to open
      <kbd>Esc</kbd> to close
    </div>
  </div>
</dialog>
