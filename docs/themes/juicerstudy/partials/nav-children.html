{{ if .pages }}
  <ul class="juicerstudy-nav-children">
    {{ for p <- .pages }}
      <li>
        <a href="{{ p.url }}" data-juicerstudy-nav-link class="juicerstudy-nav-link">{{ p.title }}</a>
      </li>
    {{ end }}
  </ul>
{{ end }}
{{ if .subsections }}
  <ul class="juicerstudy-nav-children">
    {{ for sub <- .subsections }}
      <li>
        <a href="{{ sub.url }}" data-juicerstudy-nav-link class="juicerstudy-nav-link">{{ sub.title }}</a>
        {{ partial 'nav-children' sub }}
      </li>
    {{ end }}
  </ul>
{{ end }}
