{{ if .page.ancestors }}
  <nav aria-label="Breadcrumb" class="juicerstudy-breadcrumbs">
    <ol>
      {{ for a <- .page.ancestors }}
        <li>
          <a href="{{ a.url }}" class="juicerstudy-breadcrumbs-link">{{ a.title }}</a>
          <svg xmlns="http://www.w3.org/2000/svg" class="juicerstudy-breadcrumbs-sep" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></svg>
        </li>
      {{ end }}
      <li class="juicerstudy-breadcrumbs-current">{{ .page.title }}</li>
    </ol>
  </nav>
{{ end }}
