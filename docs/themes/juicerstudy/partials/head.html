<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .page.title }}{{ .page.title }} – {{ end }}{{ .site.title }}</title>
{{ if .site.favicon }}
<link rel="icon" href="{{ relURL .site.favicon }}" />
{{ else }}{{ if .site.juicerstudy.logo }}
<link rel="icon" type="image/png" href="{{ relURL .site.juicerstudy.logo }}" />
{{ end }}{{ end }}

{{ partial 'seo' . }}

<!-- Inter font (variable) for clean typography -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

{{ partial 'dark-mode-init' . }}

<link rel="stylesheet" href="{{ relURL '/juicerstudy.css' }}" />

<!-- Site-supplied stylesheets, loaded AFTER the bundled theme CSS so
     they can override anything. Drop your file in static/site.css and
     set `customCSS = ["site.css"]` in site.toml; the list takes any
     number of paths in the order to load them. -->
{{ if .site.customCSS }}{{ for css <- .site.customCSS }}<link rel="stylesheet" href="{{ relURL css }}" />
{{ end }}{{ end }}

{{ if .site.juicerstudy.math }}
<!--
  Optional math rendering via KaTeX. Opt in with `math = true` under
  [juicerstudy] in site.toml. We pin a recent KaTeX major so future
  releases don't silently change behavior.

  The markdown library emits block math as
    <div class="math display">\[ … \]</div>
  and inline math as
    <span class="math inline">\( … \)</span>
  — both with TeX delimiters that KaTeX's auto-render picks up
  directly. The wrapping div/span give CSS hooks for the host theme
  if it wants to tweak spacing around equations.

  KaTeX is loaded over CDN to keep the theme zero-asset. Sites that
  want to vendor it locally can copy the files into static/ and
  override this partial; the script + stylesheet contract is
  documented above.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });"></script>
{{ end }}

{{ if .site.juicerstudy }}
<!--
  Site-supplied palette overrides — set under [juicerstudy] in site.toml:
    brand, brandStrong, brandSoft, accent, leaf  (light defaults)
    brandDark, brandStrongDark, brandSoftDark, accentDark, leafDark  (dark overrides)
  Anything left unset falls through to the theme defaults in juicerstudy.css.
-->
<style>
  :root {
    {{ if .site.juicerstudy.brand        }}--brand: {{ .site.juicerstudy.brand }};{{ end }}
    {{ if .site.juicerstudy.brandStrong  }}--brand-strong: {{ .site.juicerstudy.brandStrong }};{{ end }}
    {{ if .site.juicerstudy.brandSoft    }}--brand-soft: {{ .site.juicerstudy.brandSoft }};{{ end }}
    {{ if .site.juicerstudy.accent       }}--accent: {{ .site.juicerstudy.accent }};{{ end }}
    {{ if .site.juicerstudy.leaf         }}--leaf: {{ .site.juicerstudy.leaf }};{{ end }}
    {{ if .site.juicerstudy.fontSans     }}--font-sans: {{ .site.juicerstudy.fontSans }};{{ end }}
    {{ if .site.juicerstudy.fontSerif    }}--font-serif: {{ .site.juicerstudy.fontSerif }};{{ end }}
    {{ if .site.juicerstudy.fontMono     }}--font-mono: {{ .site.juicerstudy.fontMono }};{{ end }}
    {{ if .site.juicerstudy.contentMax   }}--content-max: {{ .site.juicerstudy.contentMax }};{{ end }}
    {{ if .site.juicerstudy.sidebarW     }}--sidebar-w: {{ .site.juicerstudy.sidebarW }};{{ end }}
    {{ if .site.juicerstudy.railW        }}--rail-w: {{ .site.juicerstudy.railW }};{{ end }}
    {{ if .site.juicerstudy.radiusLg     }}--radius-lg: {{ .site.juicerstudy.radiusLg }};{{ end }}
  }
  [data-theme="dark"] {
    {{ if .site.juicerstudy.brandDark        }}--brand: {{ .site.juicerstudy.brandDark }};{{ end }}
    {{ if .site.juicerstudy.brandStrongDark  }}--brand-strong: {{ .site.juicerstudy.brandStrongDark }};{{ end }}
    {{ if .site.juicerstudy.brandSoftDark    }}--brand-soft: {{ .site.juicerstudy.brandSoftDark }};{{ end }}
    {{ if .site.juicerstudy.accentDark       }}--accent: {{ .site.juicerstudy.accentDark }};{{ end }}
    {{ if .site.juicerstudy.leafDark         }}--leaf: {{ .site.juicerstudy.leafDark }};{{ end }}
  }
</style>
{{ end }}
