<header class="juicerstudy-topbar">
  <div class="juicerstudy-topbar-inner">
    <a href="{{ relURL '/' }}" class="juicerstudy-brand">
      {{ if .site.juicerstudy.logo }}
      <img src="{{ relURL .site.juicerstudy.logo }}" alt="" class="juicerstudy-brand-logo" />
      {{ end }}
      <span class="juicerstudy-brand-name">{{ .site.title }}</span>
    </a>

    <button id="juicerstudy-search-trigger" class="juicerstudy-search-trigger" aria-label="Open search">
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerstudy-search-trigger-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
      </svg>
      <span class="juicerstudy-search-trigger-label">Search…</span>
      <kbd class="juicerstudy-search-trigger-key" data-modkey="⌘">⌘K</kbd>
    </button>

    <button id="juicerstudy-sidebar-toggle" aria-label="Toggle sidebar" class="juicerstudy-icon-btn juicerstudy-sidebar-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <button id="juicerstudy-theme-toggle" data-juicer-theme-toggle aria-label="Toggle theme" class="juicerstudy-icon-btn">
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerstudy-icon-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerstudy-icon-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
      </svg>
    </button>
  </div>
</header>

{{ partial 'dark-mode-toggle' . }}
