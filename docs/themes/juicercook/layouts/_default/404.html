<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — {{ .site.title }}</title>
  <link rel="stylesheet" href="{{ relURL '/juicercook.css' }}">
</head>
<body>
  <div class="juicercook-page">
    <header class="juicercook-topbar">
      <div class="juicercook-topbar-inner">
        <a class="juicercook-brand" href="{{ relURL '/' }}">
          <span class="juicercook-brand-name">{{ .site.title }}</span>
        </a>
      </div>
    </header>
    <main class="juicercook-main">
      <article class="juicercook-section juicercook-404">
        <h1>Recipe not found</h1>
        <p>That dish isn't on the menu. <a href="{{ relURL '/' }}">Back to the kitchen</a>.</p>
      </article>
    </main>
  </div>
</body>
</html>
