<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#{{ .term.name }} — {{ .site.title }}</title>
  <link rel="stylesheet" href="{{ relURL '/juicercook.css' }}">
</head>
<body>
  <div class="juicercook-page">
    <header class="juicercook-topbar">
      <div class="juicercook-topbar-inner">
        <a class="juicercook-brand" href="{{ relURL '/' }}">
          <span class="juicercook-brand-name">{{ .site.title }}</span>
        </a>
        <nav class="juicercook-nav" aria-label="Main">
          <a href="{{ relURL '/' }}">Home</a>
          <a href="{{ relURL '/tags/' }}">Tags</a>
        </nav>
      </div>
    </header>
    <main class="juicercook-main">
      <article class="juicercook-section">
        <header class="juicercook-section-head">
          <h1 class="juicercook-section-title">#{{ .term.name }}</h1>
          <p class="juicercook-section-summary">{{ .term.count }} recipes</p>
        </header>
        {{ if .term.pages }}
        <section class="juicercook-cards">
          {{ for p <- .term.pages }}{{ partial 'recipe-card' p }}{{ end }}
        </section>
        {{ end }}
      </article>
    </main>
    <footer class="juicercook-footer">
      <div class="juicercook-footer-inner">
        <span>© {{ .site.now.year }} {{ if .site.author }}{{ .site.author }}{{ else }}{{ .site.title }}{{ end }}</span>
      </div>
    </footer>
  </div>
</body>
</html>
