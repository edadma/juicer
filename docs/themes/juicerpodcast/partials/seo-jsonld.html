<!-- Podcast JSON-LD: PodcastSeries on the home page, PodcastEpisode
     on every episode (gated on .page.audio). Apple Podcasts and Google
     parse these for richer search results. -->
{{ if not .page.noindex }}

{{ if .page.isSection and not .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "PodcastSeries",
  "name": "{{ jsonStr .site.title }}",
  "url": "{{ relURL '/' }}"{{ if .site.description }},
  "description": "{{ jsonStr .site.description }}"{{ end }}{{ if .site.juicerpodcast.cover }},
  "image": "{{ jsonStr .site.juicerpodcast.cover }}"{{ end }}{{ if .site.author }},
  "author": { "@type": "Person", "name": "{{ jsonStr .site.author }}" }{{ end }},
  "webFeed": "{{ relURL '/feed.xml' }}"
}
</script>
{{ else }}{{ if .page.audio }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "PodcastEpisode",
  "name": "{{ jsonStr .page.title }}",
  "url": "{{ jsonStr .page.permalink }}"{{ if .page.summary }},
  "description": "{{ jsonStr .page.summary }}"{{ end }}{{ if .page.image }},
  "image": "{{ jsonStr .page.image }}"{{ end }}{{ if .page.dateISO }},
  "datePublished": "{{ jsonStr .page.dateISO }}"{{ end }}{{ if .page.duration }},
  "duration": "{{ jsonStr .page.duration }}"{{ end }},
  "associatedMedia": {
    "@type": "MediaObject",
    "contentUrl": "{{ jsonStr .page.audio }}"{{ if .page.audioType }},
    "encodingFormat": "{{ jsonStr .page.audioType }}"{{ end }}
  },
  "partOfSeries": {
    "@type": "PodcastSeries",
    "name": "{{ jsonStr .site.title }}",
    "url": "{{ relURL '/' }}"
  }
}
</script>
{{ end }}{{ end }}

{{ if .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{ for a, i <- .page.ancestors }}{ "@type": "ListItem", "position": {{ i + 1 }}, "name": "{{ jsonStr a.title }}", "item": "{{ jsonStr a.permalink }}" },
    {{ end }}{ "@type": "ListItem", "position": {{ (.page.ancestors | length) + 1 }}, "name": "{{ jsonStr .page.title }}", "item": "{{ jsonStr .page.permalink }}" }
  ]
}
</script>
{{ end }}

{{ end }}
