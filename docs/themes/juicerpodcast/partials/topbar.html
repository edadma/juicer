<header class="juicerpodcast-topbar">
  <div class="juicerpodcast-topbar-inner">
    <a class="juicerpodcast-brand" href="{{ relURL '/' }}">
      {{ if .site.juicerpodcast.logo }}<img class="juicerpodcast-brand-logo" src="{{ relURL .site.juicerpodcast.logo }}" alt="">{{ end }}
      <span class="juicerpodcast-brand-name">{{ .site.title }}</span>
      {{ if .site.tagline }}<span class="juicerpodcast-brand-tagline">{{ .site.tagline }}</span>{{ end }}
    </a>

    <div class="juicerpodcast-topbar-actions">
      {{ if .site.topnav }}
      <nav class="juicerpodcast-nav" aria-label="Main">
        {{ for n <- .site.topnav }}<a href="{{ if n.url }}{{ relURL n.url }}{{ else }}#{{ end }}">{{ n.label }}</a>{{ end }}
      </nav>
      {{ end }}
      <a class="juicerpodcast-rss" href="{{ relURL '/feed.xml' }}" aria-label="Subscribe (RSS)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3v3.07A12.93 12.93 0 0117.93 19H21A16 16 0 005 3zm0 6v3.05A6.95 6.95 0 0111.95 19H15A10 10 0 005 9zm2 8a3 3 0 100 6 3 3 0 000-6z"/></svg>
      </a>
      <button class="juicerpodcast-theme-toggle" type="button" data-juicer-theme-toggle aria-label="Toggle theme">
        <svg class="juicerpodcast-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="juicerpodcast-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

{{ partial 'dark-mode-toggle' . }}
