<!-- Season / category landing — same shape as home, without the hero. -->
{{ define content }}
  <article class="juicerpodcast-section">
    <header class="juicerpodcast-section-head">
      {{ if .page.title }}<h1 class="juicerpodcast-section-title">{{ .page.title }}</h1>{{ end }}
      {{ if .page.summary }}<p class="juicerpodcast-section-summary">{{ .page.summary }}</p>{{ end }}
      {{ if .content }}<div class="juicerpodcast-section-blurb">{{ .content }}</div>{{ end }}
    </header>

    {{ if .section.pages }}
    <section class="juicerpodcast-episodes" aria-label="Episodes in {{ .page.title }}">
      {{ for p <- .section.pages }}{{ partial 'episode-card' p }}{{ end }}
    </section>
    {{ end }}
  </article>
{{ end }}
