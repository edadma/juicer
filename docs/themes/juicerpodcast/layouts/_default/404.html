<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — {{ .site.title }}</title>
  <link rel="stylesheet" href="{{ relURL '/juicerpodcast.css' }}">
</head>
<body>
  <div class="juicerpodcast-page">
    <header class="juicerpodcast-topbar">
      <div class="juicerpodcast-topbar-inner">
        <a class="juicerpodcast-brand" href="{{ relURL '/' }}">
          <span class="juicerpodcast-brand-name">{{ .site.title }}</span>
        </a>
      </div>
    </header>
    <main class="juicerpodcast-main">
      <article class="juicerpodcast-section juicerpodcast-404">
        <h1>Episode not found</h1>
        <p>That episode isn't here. <a href="{{ relURL '/' }}">Browse the feed</a>.</p>
      </article>
    </main>
  </div>
</body>
</html>
