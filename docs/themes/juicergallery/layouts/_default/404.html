<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — {{ .site.title }}</title>
  <link rel="stylesheet" href="{{ relURL '/juicergallery.css' }}">
  <!-- 404 is rendered without going through baseof, so it carries
       its own minimal chrome. -->
</head>
<body>
  <div class="juicergallery-page">
    <header class="juicergallery-topbar">
      <div class="juicergallery-topbar-inner">
        <a class="juicergallery-brand" href="{{ relURL '/' }}">
          <span class="juicergallery-brand-name">{{ .site.title }}</span>
        </a>
      </div>
    </header>
    <main class="juicergallery-main">
      <article class="juicergallery-page-wrap juicergallery-404">
        <h1>Page not found</h1>
        <p>Whatever you were looking for, it isn't here. <a href="{{ relURL '/' }}">Return home</a>.</p>
      </article>
    </main>
  </div>
</body>
</html>
