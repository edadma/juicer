<!-- Gallery JSON-LD: WebSite on the home page, ImageGallery on each
     gallery section index, BreadcrumbList on nested pages. -->

{{ if not .page.noindex }}

{{ if .page.isSection and not .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ jsonStr .site.title }}",
  "url": "{{ relURL '/' }}"{{ if .site.description }},
  "description": "{{ jsonStr .site.description }}"{{ end }}
}
</script>
{{ else }}{{ if .page.isSection and .page.photos }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ImageGallery",
  "name": "{{ jsonStr .page.title }}",
  "url": "{{ jsonStr .page.permalink }}"{{ if .page.summary }},
  "description": "{{ jsonStr .page.summary }}"{{ end }}{{ if .page.dateISO }},
  "dateCreated": "{{ jsonStr .page.dateISO }}"{{ end }},
  "associatedMedia": [
    {{ for p, i <- .page.photos }}{{ if i }},
    {{ end }}{ "@type": "ImageObject", "contentUrl": "{{ if p.src }}{{ jsonStr p.src }}{{ else }}{{ jsonStr p }}{{ end }}"{{ if p.caption }}, "caption": "{{ jsonStr p.caption }}"{{ end }} }{{ end }}
  ]
}
</script>
{{ end }}{{ end }}

{{ if .page.ancestors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{ for a, i <- .page.ancestors }}{ "@type": "ListItem", "position": {{ i + 1 }}, "name": "{{ jsonStr a.title }}", "item": "{{ jsonStr a.permalink }}" },
    {{ end }}{ "@type": "ListItem", "position": {{ (.page.ancestors | length) + 1 }}, "name": "{{ jsonStr .page.title }}", "item": "{{ jsonStr .page.permalink }}" }
  ]
}
</script>
{{ end }}

{{ end }}
