<nav id="juicerdocs-sidebar" aria-label="Site navigation" class="text-sm">
  {{ if .site.root }}
    <ul class="space-y-1">
      {{ for sec <- .site.root.subsections }}
        <li class="mb-4">
          <a href="{{ sec.url }}" class="block font-semibold text-zinc-900 dark:text-zinc-100 px-2 py-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-900">
            {{ sec.title }}
          </a>
          {{ partial 'nav-children' sec }}
        </li>
      {{ end }}
    </ul>
  {{ end }}
</nav>
