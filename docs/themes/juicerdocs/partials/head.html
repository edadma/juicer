<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .page.title }}{{ .page.title }} – {{ end }}{{ .site.title }}</title>
{{ if .page.summary }}<meta name="description" content="{{ .page.summary }}" />{{ end }}
<link rel="canonical" href="{{ .page.permalink }}" />
<link rel="icon" type="image/png" href="{{ relURL '/juicer-logo.png' }}" />
<link rel="alternate" type="application/atom+xml" href="{{ relURL '/feed.xml' }}" title="{{ .site.title }}" />

<!-- Inter font (variable) for clean typography -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

<!--
  Apply the theme BEFORE first paint to avoid the white flash.
  Reads localStorage ('juicerdocs-theme'), falls back to system preference.
  Sets data-theme="dark" or data-theme="light" on <html>.
-->
<script>
  (function() {
    try {
      var stored = localStorage.getItem('juicerdocs-theme');
      var dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>

<!--
  Tailwind CSS v4 — browser CDN. JIT-compiles classes on every page load.
  We mostly use Tailwind for layout + spacing; theme colors flow through
  CSS variables in juicerdocs.css so they don't depend on Tailwind's
  variant compiler (which is unreliable through @tailwindcss/browser).
-->
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script type="text/tailwindcss">
  @plugin "@tailwindcss/typography";
</script>

<link rel="stylesheet" href="{{ relURL '/juicerdocs.css' }}" />
