{{ if .pages }}
  <ul class="mt-1 space-y-0.5 border-l border-border-soft">
    {{ for p <- .pages }}
      <li>
        <a href="{{ p.url }}" data-juicerdocs-nav-link
           class="block py-1.5 px-3 -ml-px border-l-2 border-transparent rounded-md text-fg-soft no-underline transition hover:text-brand hover:bg-brand-soft">
          {{ p.title }}
        </a>
      </li>
    {{ end }}
  </ul>
{{ end }}
{{ if .subsections }}
  <ul class="mt-1 space-y-0.5 border-l border-border-soft">
    {{ for sub <- .subsections }}
      <li>
        <a href="{{ sub.url }}" data-juicerdocs-nav-link
           class="block py-1.5 px-3 -ml-px border-l-2 border-transparent rounded-md font-medium text-fg-soft no-underline transition hover:text-brand hover:bg-brand-soft">
          {{ sub.title }}
        </a>
        {{ partial 'nav-children' sub }}
      </li>
    {{ end }}
  </ul>
{{ end }}
