{{ if .page.prev or .page.next }}
  <nav class="not-prose mt-12 grid grid-cols-2 gap-4" aria-label="Page navigation">
    {{ if .page.prev }}
      <a href="{{ .page.prev.url }}" class="group flex flex-col p-4 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:border-orange-500 dark:hover:border-orange-500 transition">
        <span class="text-xs text-zinc-500 dark:text-zinc-500 group-hover:text-orange-600 dark:group-hover:text-orange-400">← Previous</span>
        <span class="font-semibold text-zinc-900 dark:text-zinc-100 mt-1">{{ .page.prev.title }}</span>
      </a>
    {{ else }}
      <div></div>
    {{ end }}
    {{ if .page.next }}
      <a href="{{ .page.next.url }}" class="group flex flex-col p-4 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:border-orange-500 dark:hover:border-orange-500 transition text-right">
        <span class="text-xs text-zinc-500 dark:text-zinc-500 group-hover:text-orange-600 dark:group-hover:text-orange-400">Next →</span>
        <span class="font-semibold text-zinc-900 dark:text-zinc-100 mt-1">{{ .page.next.title }}</span>
      </a>
    {{ else }}
      <div></div>
    {{ end }}
  </nav>
{{ end }}
