{{ if .page.prev or .page.next }}
  <nav class="not-prose mt-12 grid grid-cols-2 gap-4" aria-label="Page navigation">
    {{ if .page.prev }}
      <a href="{{ .page.prev.url }}"
         class="flex flex-col p-4 rounded-lg border border-border bg-surface-2 no-underline transition hover:border-brand hover:-translate-y-0.5 hover:shadow-lg">
        <span class="text-xs text-muted">← Previous</span>
        <span class="font-semibold text-fg mt-1">{{ .page.prev.title }}</span>
      </a>
    {{ else }}
      <div></div>
    {{ end }}
    {{ if .page.next }}
      <a href="{{ .page.next.url }}"
         class="flex flex-col p-4 rounded-lg border border-border bg-surface-2 no-underline text-right transition hover:border-brand hover:-translate-y-0.5 hover:shadow-lg">
        <span class="text-xs text-muted">Next →</span>
        <span class="font-semibold text-fg mt-1">{{ .page.next.title }}</span>
      </a>
    {{ else }}
      <div></div>
    {{ end }}
  </nav>
{{ end }}
