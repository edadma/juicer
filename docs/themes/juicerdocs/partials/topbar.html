<header class="sticky top-0 z-30 h-14 bg-white/95 dark:bg-zinc-950/95 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800">
  <div class="mx-auto max-w-screen-2xl flex items-center gap-4 h-full px-4">
    <a href="{{ relURL '/' }}" class="flex items-center gap-2 font-bold text-lg shrink-0">
      <span aria-hidden="true">🧃</span>
      <span class="hidden sm:inline">{{ .site.title }}</span>
    </a>

    <div class="flex-1 max-w-md mx-auto relative">
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
        </svg>
        <input id="juicerdocs-search" type="search" placeholder="Search…" autocomplete="off"
               class="w-full pl-9 pr-3 py-1.5 rounded-md border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent" />
      </div>
      <div id="juicerdocs-search-results" class="hidden absolute left-0 right-0 mt-1 max-h-96 overflow-y-auto rounded-md border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-lg z-40"></div>
    </div>

    <button id="juicerdocs-sidebar-toggle" aria-label="Toggle sidebar" class="lg:hidden p-2 rounded hover:bg-zinc-100 dark:hover:bg-zinc-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <button id="juicerdocs-theme-toggle" aria-label="Toggle dark mode" class="p-2 rounded hover:bg-zinc-100 dark:hover:bg-zinc-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
    </button>
  </div>
</header>
