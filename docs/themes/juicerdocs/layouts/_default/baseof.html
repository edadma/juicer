<!DOCTYPE html>
<html lang="en" class="">
<head>
  {{ partial 'head' . }}
</head>
<body class="bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  {{ partial 'topbar' . }}

  <div class="mx-auto max-w-screen-2xl flex">
    <aside class="hidden lg:block w-64 shrink-0 border-r border-zinc-200 dark:border-zinc-800 px-4 py-8 sticky top-14 self-start max-h-[calc(100vh-3.5rem)] overflow-y-auto">
      {{ partial 'sidebar' . }}
    </aside>

    <main class="flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-8">
      <div class="max-w-3xl mx-auto">
        {{ partial 'breadcrumbs' . }}
        {{ block main . }}
          <article class="prose prose-zinc dark:prose-invert max-w-none">
            <h1>{{ .page.title }}</h1>
            {{ .content }}
          </article>
        {{ end }}
        {{ partial 'prev-next' . }}
      </div>
    </main>

    <aside class="hidden xl:block w-56 shrink-0 px-4 py-8 sticky top-14 self-start max-h-[calc(100vh-3.5rem)] overflow-y-auto">
      {{ partial 'page-toc' . }}
    </aside>
  </div>

  {{ partial 'footer' . }}

  <script src="{{ relURL '/juicerdocs.js' }}"></script>
</body>
</html>
