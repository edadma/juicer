{{ define main }}
<article class="prose prose-zinc dark:prose-invert prose-headings:scroll-mt-20 max-w-none">
  <h1>{{ .page.title }}</h1>
  {{ if .page.summary }}<p class="lead text-lg text-zinc-600 dark:text-zinc-400 not-prose mb-8">{{ .page.summary }}</p>{{ end }}
  {{ .content }}
</article>
{{ end }}
