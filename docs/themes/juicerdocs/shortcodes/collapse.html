<details class="not-prose my-4 rounded-lg border border-zinc-200 dark:border-zinc-800 [&[open]>summary]:border-b">
  <summary class="cursor-pointer px-4 py-2 font-medium text-zinc-900 dark:text-zinc-100 select-none hover:bg-zinc-50 dark:hover:bg-zinc-900 border-zinc-200 dark:border-zinc-800">
    {{ head .args }}
  </summary>
  <div class="px-4 py-3 prose prose-sm dark:prose-invert max-w-none">
    {{ markdownify .content }}
  </div>
</details>
