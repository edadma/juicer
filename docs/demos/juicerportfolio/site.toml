# Example portfolio-site — exercises the juicerportfolio theme.
# Stage-1 demo: home (intro + 4-project grid) + 4 project pages
# + about page. Stage-2 will add per-project galleries, tag/category
# filters, and project-to-project nav. Stage-3 adds CV/contact/press
# secondary pages and the theme reference docs.
#
# Demo subject: "Atelier Hahn" — a fictional one-person industrial
# design studio doing furniture, lighting, and small objects.
#
# Local preview:
#   sbt 'juicerJVM/run serve -s examples/portfolio-site -L'

title       = "Atelier Hahn"
tagline     = "Industrial design, Lisbon"
author      = "Mira Hahn"
baseURL     = "http://localhost:8080"
description = "Mira Hahn is an independent industrial designer based in Lisbon. Selected work in furniture, lighting, and small objects."

themeDir = "../../themes"
theme    = "juicerportfolio"

htmlDir = ""
sortBy  = "date"

# Optional engine keys, all themes read these.
# favicon          = "/favicon.svg"
# hideJuicerCredit = true

# Optional: Person JSON-LD on the homepage. Drives Google's Knowledge
# Panel for an individual. See the SEO section of the juicerportfolio
# configuration docs.
[person]
name     = "Mira Hahn"
jobTitle = "Industrial designer"
email    = "mira@atelierhahn.example"
sameAs   = ["https://instagram.com/atelierhahn", "https://github.com/atelierhahn"]

# Topbar nav links. Order is left-to-right.
[[topnav]]
label = "Work"
url   = "/"

[[topnav]]
label = "About"
url   = "/about/"

[[topnav]]
label = "CV"
url   = "/cv/"

[[topnav]]
label = "Press"
url   = "/press/"

[[topnav]]
label = "Contact"
url   = "/contact/"

# Footer contact line + links. Both optional.
[contact]
email    = "studio@atelierhahn.example"
location = "Lisbon, Portugal"

[[links]]
label = "Instagram"
url   = "https://instagram.com/example"

[[links]]
label = "Are.na"
url   = "https://are.na/example"

[[links]]
label = "Newsletter"
url   = "https://buttondown.email/example"

# Work-grid filter chips. Each row: {label, value}. Projects that
# match a chip set `category = "<value>"` in their frontmatter; the
# filter chip "All" is always shown first by the home layout.
[[workCategories]]
label = "Furniture"
value = "furniture"

[[workCategories]]
label = "Lighting"
value = "lighting"

[[workCategories]]
label = "Objects"
value = "objects"

# Per-site palette overrides. Defaults are warm-paper + rust accent.
# Uncomment to retune; see docs/content/reference/theming.md.
#
# [juicerportfolio]
# brand  = "#0f766e"   # teal-700
# accent = "#1c1814"
