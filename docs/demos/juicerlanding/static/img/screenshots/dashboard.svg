<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, system-ui, sans-serif">
  <!-- Frame: rounded panel with subtle window shadow.
       Palette is intentionally neutral (slate + indigo + amber)
       so the figure reads in both light and dark theme contexts —
       the <img> can't inherit data-theme from the host page. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="14" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="170" height="500" rx="14" fill="#0f172a"/>
  <rect x="160" y="0" width="10" height="500" fill="#0f172a"/>
  <text x="22" y="42" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">▣ Tally</text>
  <text x="22" y="62" font-size="10" fill="#94a3b8" letter-spacing="0.08em">stratus.coffee</text>

  <!-- Sidebar nav -->
  <rect x="14" y="100" width="142" height="32" rx="6" fill="#4f46e5"/>
  <circle cx="30" cy="116" r="3" fill="#ffffff"/>
  <text x="42" y="120" font-size="13" fill="#ffffff" font-weight="500">Dashboard</text>

  <text x="42" y="158" font-size="13" fill="#cbd5e1">Pages</text>
  <circle cx="30" cy="154" r="3" fill="#475569"/>

  <text x="42" y="186" font-size="13" fill="#cbd5e1">Sources</text>
  <circle cx="30" cy="182" r="3" fill="#475569"/>

  <text x="42" y="214" font-size="13" fill="#cbd5e1">Events</text>
  <circle cx="30" cy="210" r="3" fill="#475569"/>

  <text x="42" y="242" font-size="13" fill="#cbd5e1">Funnels</text>
  <circle cx="30" cy="238" r="3" fill="#475569"/>

  <text x="22" y="460" font-size="11" fill="#64748b">Settings</text>
  <text x="22" y="478" font-size="11" fill="#64748b">Sign out</text>

  <!-- Header strip -->
  <text x="200" y="44" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Dashboard</text>
  <text x="200" y="64" font-size="12" fill="#64748b">stratus.coffee · last 30 days</text>
  <rect x="640" y="28" width="140" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="710" y="48" font-size="12" fill="#334155" text-anchor="middle">Last 30 days ▾</text>

  <!-- Big number card -->
  <g filter="url(#shadow)">
    <rect x="200" y="90" width="270" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="220" y="118" font-size="11" fill="#64748b" letter-spacing="0.06em">UNIQUE VISITORS</text>
  <text x="220" y="160" font-size="36" font-weight="700" fill="#0f172a" letter-spacing="-0.03em">12,438</text>
  <text x="220" y="184" font-size="12" fill="#10b981" font-weight="600">▲ 18% vs prev period</text>

  <!-- Pageviews card -->
  <g filter="url(#shadow)">
    <rect x="490" y="90" width="290" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="510" y="118" font-size="11" fill="#64748b" letter-spacing="0.06em">PAGEVIEWS</text>
  <text x="510" y="160" font-size="36" font-weight="700" fill="#0f172a" letter-spacing="-0.03em">31,907</text>
  <text x="510" y="184" font-size="12" fill="#10b981" font-weight="600">▲ 11% vs prev period</text>

  <!-- Chart card (left) -->
  <g filter="url(#shadow)">
    <rect x="200" y="220" width="380" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="220" y="248" font-size="13" font-weight="600" fill="#0f172a">Visitors over time</text>
  <text x="220" y="266" font-size="11" fill="#64748b">Daily, last 30 days</text>

  <!-- Bars: 30 of varying height across x:220-560, y baseline 430 -->
  <g fill="url(#bar)">
    <rect x="220" y="380" width="8" height="40" rx="2"/>
    <rect x="232" y="370" width="8" height="50" rx="2"/>
    <rect x="244" y="358" width="8" height="62" rx="2"/>
    <rect x="256" y="345" width="8" height="75" rx="2"/>
    <rect x="268" y="362" width="8" height="58" rx="2"/>
    <rect x="280" y="332" width="8" height="88" rx="2"/>
    <rect x="292" y="320" width="8" height="100" rx="2"/>
    <rect x="304" y="304" width="8" height="116" rx="2"/>
    <rect x="316" y="318" width="8" height="102" rx="2"/>
    <rect x="328" y="308" width="8" height="112" rx="2"/>
    <rect x="340" y="290" width="8" height="130" rx="2"/>
    <rect x="352" y="278" width="8" height="142" rx="2"/>
    <rect x="364" y="296" width="8" height="124" rx="2"/>
    <rect x="376" y="284" width="8" height="136" rx="2"/>
    <rect x="388" y="270" width="8" height="150" rx="2"/>
    <rect x="400" y="266" width="8" height="154" rx="2"/>
    <rect x="412" y="280" width="8" height="140" rx="2"/>
    <rect x="424" y="262" width="8" height="158" rx="2"/>
    <rect x="436" y="252" width="8" height="168" rx="2"/>
    <rect x="448" y="244" width="8" height="176" rx="2"/>
    <rect x="460" y="236" width="8" height="184" rx="2"/>
    <rect x="472" y="248" width="8" height="172" rx="2"/>
    <rect x="484" y="234" width="8" height="186" rx="2"/>
    <rect x="496" y="222" width="8" height="198" rx="2"/>
    <rect x="508" y="218" width="8" height="202" rx="2"/>
    <rect x="520" y="232" width="8" height="188" rx="2"/>
    <rect x="532" y="220" width="8" height="200" rx="2"/>
    <rect x="544" y="208" width="8" height="212" rx="2"/>
    <rect x="556" y="216" width="8" height="204" rx="2"/>
    <rect x="568" y="204" width="8" height="216" rx="2"/>
  </g>
  <line x1="220" y1="430" x2="568" y2="430" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="448" font-size="9" fill="#94a3b8">Apr 9</text>
  <text x="394" y="448" font-size="9" fill="#94a3b8" text-anchor="middle">Apr 23</text>
  <text x="568" y="448" font-size="9" fill="#94a3b8" text-anchor="end">May 9</text>

  <!-- Top pages card (right) -->
  <g filter="url(#shadow)">
    <rect x="600" y="220" width="180" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="618" y="248" font-size="13" font-weight="600" fill="#0f172a">Top pages</text>
  <text x="618" y="266" font-size="11" fill="#64748b">Last 30 days</text>

  <g font-size="11" fill="#334155">
    <text x="618" y="294">/</text>
    <text x="762" y="294" text-anchor="end" fill="#0f172a" font-weight="600">8.2k</text>
    <rect x="618" y="300" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="300" width="144" height="3" rx="1.5" fill="#4f46e5"/>

    <text x="618" y="324">/menu/</text>
    <text x="762" y="324" text-anchor="end" fill="#0f172a" font-weight="600">3.1k</text>
    <rect x="618" y="330" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="330" width="55" height="3" rx="1.5" fill="#4f46e5"/>

    <text x="618" y="354">/visit/</text>
    <text x="762" y="354" text-anchor="end" fill="#0f172a" font-weight="600">2.4k</text>
    <rect x="618" y="360" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="360" width="42" height="3" rx="1.5" fill="#4f46e5"/>

    <text x="618" y="384">/working/</text>
    <text x="762" y="384" text-anchor="end" fill="#0f172a" font-weight="600">1.7k</text>
    <rect x="618" y="390" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="390" width="30" height="3" rx="1.5" fill="#4f46e5"/>

    <text x="618" y="414">/photos/</text>
    <text x="762" y="414" text-anchor="end" fill="#0f172a" font-weight="600">1.2k</text>
    <rect x="618" y="420" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="420" width="22" height="3" rx="1.5" fill="#4f46e5"/>

    <text x="618" y="444">/about/</text>
    <text x="762" y="444" text-anchor="end" fill="#0f172a" font-weight="600">0.9k</text>
    <rect x="618" y="450" width="144" height="3" rx="1.5" fill="#eef2ff"/>
    <rect x="618" y="450" width="16" height="3" rx="1.5" fill="#4f46e5"/>
  </g>
</svg>
