# Example cafe-site — exercises the juicercafe theme. Stage-1
# scaffolding: enough to render the home, hours widget, visit, menu
# placeholder, working-from-here pitch, and contact pages with
# real-ish demo content.
#
# Local preview:
#   sbt 'juicerJVM/run serve -s examples/cafe-site -L'

title    = "Stratus Coffee"
tagline  = "Coffee, quiet hours, and outlets enough for everyone."
author   = "Stratus Coffee"
baseURL  = "http://localhost:8080"

themeDir = "../../docs/themes"
theme    = "juicercafe"

htmlDir  = ""
sortBy   = "date"

# The team listing + per-author archives live under /team/ instead of
# the engine default /authors/, so the URL matches the topbar label.
# The juicercafe layouts read `.site.authorsPath` so flipping this is
# a one-line change.
authorsPath = "/team/"

# ============================================================
# Hours — surfaced on the homepage, the footer, and /visit/.
# Theme reads these from [[hours]] in this same file. Each row:
#   day, open, close, optional note. closed = true makes the row
#   render "closed" (italicized).
# ============================================================
[[hours]]
day   = "Monday"
open  = "7:00 AM"
close = "8:00 PM"
note  = "Quiet hours after 5pm"

[[hours]]
day   = "Tuesday"
open  = "7:00 AM"
close = "8:00 PM"
note  = "Quiet hours after 5pm"

[[hours]]
day   = "Wednesday"
open  = "7:00 AM"
close = "8:00 PM"
note  = "Quiet hours after 5pm"

[[hours]]
day   = "Thursday"
open  = "7:00 AM"
close = "9:00 PM"
note  = "Open mic from 7pm"

[[hours]]
day   = "Friday"
open  = "7:00 AM"
close = "9:00 PM"

[[hours]]
day   = "Saturday"
open  = "8:00 AM"
close = "9:00 PM"

[[hours]]
day    = "Sunday"
open   = "8:00 AM"
close  = "6:00 PM"
note   = "Bottomless drip $4"

# ============================================================
# Visit info — surfaced on the homepage and on /visit/.
# ============================================================
[visit]
address     = "412 Cedar Lane"
city        = "Portland"
state       = "OR"
zip         = "97214"
mapURL      = "https://www.openstreetmap.org/?mlat=45.514&mlon=-122.642#map=16/45.514/-122.642"
transit     = "5-min walk from SE Belmont · streetcar two blocks east"
parkingNote = "Street parking + small lot off Pine Avenue. Bike racks at the front door."

# ============================================================
# Team registry — rides the engine's [[authors]] machinery, just
# named "The team" in the theme copy. Posts that have an `author:`
# or `authors:` field reference these IDs.
# ============================================================
[[authors]]
id     = "rosa"
name   = "Rosa Lindgren"
role   = "Owner · Roaster relationships"
bio    = "Rosa opened Stratus in 2022 with Mike and Andre. She handles bean sourcing, vendor relationships, and most of the morning bake-pickup. Has strong opinions about extraction yield and weak ones about everything else."
avatar = "/img/team/rosa.svg"
email  = "rosa@stratus.example"

[[authors.links]]
label = "Mastodon"
url   = "https://example.social/@rosa"

[[authors]]
id     = "mike"
name   = "Mike Park"
role   = "Owner · Bar manager"
bio    = "Mike runs the bar — espresso program, pour-over rotation, the latte-art class on Sundays. Twelve years in specialty before this; previously at Barista PDX."
avatar = "/img/team/mike.svg"
email  = "mike@stratus.example"

[[authors]]
id     = "andre"
name   = "Andre Costa"
role   = "Owner · Kitchen + IT"
bio    = "Andre handles the lunch menu and (because someone has to) the wi-fi, the POS, the back-room outlets, and the captive portal. Cooks at home professionally. Maintains the open-source captive-portal that runs the Stratus-Guest network."
avatar = "/img/team/andre.svg"
email  = "andre@stratus.example"

[[authors]]
id     = "jen"
name   = "Jen Okafor"
role   = "Senior Barista"
bio    = "Jen has been at Stratus since the summer of 2023. Trains new staff, runs Saturday mornings, and brews the Tuesday cupping selections."
avatar = "/img/team/jen.svg"

[[authors]]
id     = "diego"
name   = "Diego Alvarado"
role   = "Barista · Sound engineer"
bio    = "Diego runs Thursday open mic when he's not behind the bar. Plays a bit of everything; happy to recommend an album."
avatar = "/img/team/diego.svg"

# ============================================================
# Working-from-here info — surfaced via partials/working-card.html on
# the /working/ page (and anywhere else the theme inlines the partial).
# All keys optional; the card silently omits any row whose data is
# missing. Add or remove keys as your space allows.
# ============================================================
[working]
wifiSSID   = "Stratus-Guest"
wifiNote   = "Captive portal — splash page appears after the first request."
outlets    = "At every two-top, along the bay window, and the four-seater long table."
quietHours = "5pm–close on weekdays. Phone calls go in the back room."
calls      = "Calls under 5 min at your seat. Anything longer, please use the back room."
groups     = "Groups of 4+ on weekdays — please email ahead so we can hold the long table."
stay       = "Stay as long as you like. We do not watch the clock."

# Per-site palette overrides. Defaults are espresso/cream/caramel.
# Uncomment to retune.
#
# [juicercafe]
# brand  = "#0f766e"   # teal-700
# accent = "#7c3aed"   # violet-600
