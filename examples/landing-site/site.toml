# ============================================================
# FAQ — native <details>/<summary>; first item open by default.
# ============================================================
[faqHead]
title = "Frequently asked"
body  = "If you have a question that isn't here, mail hi@tally.dev — we like the long ones."

[[faqs]]
open = true
q    = "Is Tally really GDPR-compliant out of the box?"
a    = "Yes. We don't set cookies, we don't fingerprint, and we don't retain anything that would let us re-identify a visitor across days. The salt that hashes IP+UA into a daily visitor ID is rotated every 24h and never persisted. The European Data Protection Board's 2024 guidance on cookie-less analytics covers exactly this design."

[[faqs]]
q = "How does Tally handle single-page apps?"
a = "It listens for History API navigations (pushState / replaceState / popstate) and emits a virtual page view automatically. React Router, SvelteKit, Next.js App Router, Vue Router, Astro view transitions — anything that uses History API works without configuration."

[[faqs]]
q = "Can I self-host?"
a = "Yes — that's the free tier. Single Docker container, SQLite by default, Postgres if you scale past a few sites. Same image as the cloud product, MIT licensed. The full source is on GitHub."

[[faqs]]
q = "How long is data retained?"
a = "Forever on self-hosted (your database, your call). 5 years on Cloud and Agency. Raw events expire after 90 days; everything older is rolled up into daily aggregates so you can keep dashboards meaningful without holding visitor-resolution data."

[[faqs]]
q = "How does Tally compare to Google Analytics 4?"
a = "GA4 is a 280 KB tag, requires a consent banner in most jurisdictions, and ships your visitors' data through Google's ads stack. Tally is under 1 KB, requires no consent banner because it doesn't process personal data, and never leaves your domain. The trade-off is that GA4 has more dimensions to slice by — Tally is intentionally a small set of the questions most projects need answers to."

[[faqs]]
q = "Will it slow my site down?"
a = "The script is async and defer-loaded, so it never blocks rendering. The single POST per page-view fires after the load event. Typical Lighthouse score impact: zero."

[[faqs]]
q = "What about ad-blockers?"
a = "If you serve the script from your own domain (the recommended setup — we provide a /docs/proxy guide), uBlock Origin and AdBlock Plus do not block it. The default tally.dev-hosted script is on most blocklists; first-party hosting solves it."

[[faqs]]
q = "Can I export my data?"
a = "Yes, any time, no charge. Raw events as CSV from the dashboard, full database snapshot via the API. We mean it about no lock-in."

