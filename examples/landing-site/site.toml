# Example landing-site — exercises the juicerlanding theme. Stage-2
# demo: hero, features, code section, screenshot showcase, pricing,
# testimonials, FAQ, final CTA, footer. Stage-3 will add the trust
# bar, secondary pages (changelog/about/privacy), and dark-mode polish.
#
# Demo product: "Tally" — a fictional privacy-first analytics tool
# for indie devs. Picked because every section of the theme has
# something concrete to render against it.
#
# Local preview:
#   sbt 'juicerJVM/run serve -s examples/landing-site -L'

title       = "Tally"
tagline     = "Web analytics that respects your visitors."
author      = "Tally"
baseURL     = "http://localhost:8080"
description = "Privacy-first web analytics for indie developers. One line of code, zero cookies, GDPR-clean by default."

themeDir = "../../docs/themes"
theme    = "juicerlanding"

htmlDir = ""
sortBy  = "date"

# Optional engine keys, all themes read these.
# favicon          = "/favicon.svg"
# hideJuicerCredit = true
repoURL = "https://github.com/example/tally"

# Topbar CTA — surfaced on every page so the "start free" path is
# always one click away. Falls back to nothing if unset.
[topbarCta]
label = "Start free"
url   = "#pricing"

# Topbar nav links. Order is left-to-right. NOTE: keyed `topnav`, not
# `nav` — top-level `nav` is the juicer engine's reserved key for
# table-of-contents configuration.
[[topnav]]
label = "Features"
url   = "#features"

[[topnav]]
label = "Pricing"
url   = "#pricing"

[[topnav]]
label = "Docs"
url   = "/docs/"

# ============================================================
# Hero — single [hero] block. The home layout silently omits the
# section if this block is absent.
# ============================================================
[hero]
eyebrow      = "v1.0 · privacy-first"
headline     = "Web analytics that respects your visitors."
subheadline  = "One line of code, zero cookies, GDPR-clean by default. See where your traffic comes from without compromising the people who give it to you."
codeLang     = "html"
codeSnippet  = """<script defer
  src="https://tally.dev/t.js"
  data-site="YOUR_KEY">
</script>"""

[hero.primaryCta]
label = "Start free"
url   = "#pricing"

[hero.secondaryCta]
label = "View on GitHub"
url   = "https://github.com/example/tally"

# ============================================================
# Trust bar — small monochrome logos. Heading text is optional;
# defaults to "Trusted by teams at" if `trustLabel` is not set.
# ============================================================
trustLabel = "In production at"

[[trust]]
logo = "/img/logos/loomline.svg"
alt  = "Loomline"
url  = "https://example.com/loomline"

[[trust]]
logo = "/img/logos/bramble.svg"
alt  = "Bramble Co."
url  = "https://example.com/bramble"

[[trust]]
logo = "/img/logos/mesa.svg"
alt  = "Mesa Cloud"
url  = "https://example.com/mesa"

[[trust]]
logo = "/img/logos/pinecone.svg"
alt  = "Pinecone Labs"
url  = "https://example.com/pinecone"

[[trust]]
logo = "/img/logos/halftone.svg"
alt  = "Halftone"
url  = "https://example.com/halftone"

# ============================================================
# Features — grid section heading is optional; six cards.
# ============================================================
[featuresHead]
title = "Everything you need, nothing you don't"
body  = "Modern analytics shouldn't require a privacy compromise or a cookie banner. Tally is the smallest possible thing that gives you the answers."

[[features]]
icon  = "🍪"
title = "No cookies, no banners"
body  = "Visitors are counted by hashing IP + user-agent into a daily-rotated salt. Nothing persists across days, nothing identifies a person."

[[features]]
icon  = "⚡"
title = "Less than 1 KB"
body  = "The tracker script is gzipped to under 900 bytes. No frameworks, no bundlers, no third-party requests after the initial pixel."

[[features]]
icon  = "🛣️"
title = "SPA-aware"
body  = "Detects History API navigation automatically. React Router, SvelteKit, Next.js — virtual page views just work, no manual instrumentation."

[[features]]
icon  = "📊"
title = "Real-time dashboard"
body  = "Live visitor count + page-view stream that updates as people land. No 24-hour delay, no aggregation lag."

[[features]]
icon  = "📁"
title = "Exportable everything"
body  = "Download raw events as CSV any time. Your data, your laptop, no vendor lock-in. Pipe it into DuckDB and slice however you like."

[[features]]
icon  = "🐳"
title = "Self-hostable"
body  = "Single Docker container, SQLite by default, Postgres if you outgrow it. Same code as the cloud product. MIT licensed."

# ============================================================
# Code section — separate from the hero's install one-liner; this
# one shows the "more interesting" custom-events API to make the
# point that Tally isn't just a pageview counter.
# ============================================================
[code]
title   = "Track what matters, not who's clicking"
body    = "Custom events are one function call. No SDK, no schema, no consent dance — just a name and an optional dict of properties."
lang    = "javascript"
bullets = [
  "First-party only — events POST to your own /tally endpoint",
  "Properties are aggregated server-side; no per-user history",
  "Same API in the browser, in service workers, in Node",
]
snippet = """tally('signup', {
  plan: 'pro',
  source: 'docs',
})

tally('export.csv', {
  rows: 12_400,
})"""

# ============================================================
# Screenshot showcase — figure with side-by-side copy. Single
# [showcase] block; the demo SVG lives at static/img/screenshots/.
# ============================================================
[showcase]
title   = "A dashboard you can read at a glance"
body    = "Today's visitors, top pages, top referrers, conversion funnel — the things you actually look at every day, on one page. No drilldowns required, no time spent learning a query language."
image   = "/img/screenshots/dashboard.svg"
alt     = "Tally dashboard showing today's visitors, top pages, top referrers, and a conversion funnel"
caption = "The dashboard. No, there isn't a second tab."
reverse = true

