# Build & deploy juicer.run.
#
#   Push to `stable` → builds and deploys to GitHub Pages (production).
#   Push to any other branch → builds and uploads as an artifact (preview).
#
# To wire up the production custom domain (juicer.run):
#   1. In repo Settings → Pages: source = GitHub Actions.
#   2. Add `juicer.run` as the custom domain (creates a CNAME file).
#   3. Add a DNS A/CNAME record pointing juicer.run at GitHub Pages.
#
# Preview deployments live in the workflow artifact for now; switch to
# Cloudflare Pages or Netlify if you want auto preview URLs per branch.

name: Docs

on:
  push:
    branches: ["stable", "dev"]
  pull_request:
    branches: ["stable"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java does NOT ship sbt — the runner image only has
      # the JDK after the previous step. Install sbt explicitly via the
      # official sbt-maintained action.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/themes/juicerdocs/package-lock.json

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # Tailwind v4 build — compiles src/tailwind.css into the bundled
      # static/juicerdocs.css. Committed output isn't strictly required
      # in CI (we could rely on what's in the working tree), but a fresh
      # build catches any stale artifact bugs.
      - name: Install theme deps
        working-directory: docs/themes/juicerdocs
        run: npm ci

      - name: Build theme CSS
        working-directory: docs/themes/juicerdocs
        run: npm run build

      - name: Build docs site
        run: sbt 'juicerJVM/run build -s docs -d _site -b https://juicer.run/'

      - name: Write CNAME
        if: github.ref == 'refs/heads/stable'
        run: echo 'juicer.run' > _site/CNAME

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/stable'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/stable'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
