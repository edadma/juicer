# Build & deploy juicer.run.
#
#   Push to `stable`     → builds and deploys to GitHub Pages.
#   PR targeting `stable` → builds (sanity check), no deploy.
#   workflow_dispatch    → manual trigger from the Actions tab.
#
# `dev` pushes are NOT triggered — local `juicer serve -L` is the
# preview path. If you want a build-on-every-push canary, add `dev`
# back to the push branches list.

name: Docs

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java does NOT ship sbt — the runner image only has
      # the JDK after the previous step. Install sbt explicitly via the
      # official sbt-maintained action.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      - name: Build docs site
        run: sbt 'juicerJVM/run build -s docs -d _site -b https://juicer.run/'

      # Each theme's "Demo site" sidebar leaf is served from
      # `/themes/<theme>/demo/` and rendered using THAT theme (not
      # juicerdocs), so each demo is built as a separate juicer site and
      # its output is dropped on top of the docs render at the same path.
      # juicerdocs has no demo-site source — the docs site itself IS the
      # demo, so its "Demo site" leaf links back to `/`.
      - name: Build per-theme demo sites
        run: bash bin/build-demos.sh _site https://juicer.run/

      - name: Write CNAME
        if: github.ref == 'refs/heads/stable'
        run: echo 'juicer.run' > _site/CNAME

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/stable'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/stable'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
